# Prime server configuration (copied next to the binary by scripts/build.sh).  Ports differ from the old server so both can run side by side while we port.
[Path]
Bof                  loadkod/
Memmap               memmap/
Rsc                  rsc/
Rooms                rooms/
Motd                 ./
Channel              channel/
LoadSave             savegame/
Forms                ./
Kodbase              .
PackageFile          ./

[Socket]
Port                 5960
MaintenancePort      9999
MaintenanceMask      ::ffff:127.0.0.1

[Resource]
RscSpec              *.rsc

[Login]
SecretKey            prime-secret

[Channel]
DebugDisk            Yes
ErrorDisk            Yes
LogDisk              Yes

[Account]
NumSlots             10
